services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hshop2023-sqlserver
    environment:
      ACCEPT_EULA: "${ACCEPT_EULA}"
      MSSQL_PID: "${MSSQL_PID}"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - hshop2023_sql_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  hshop2023_sql_data:

